name: Verify Meet8
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meet8
          POSTGRES_PASSWORD: meet8-ci-only
          POSTGRES_DB: meet8
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U meet8" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: docker run -d --name meet8-ci-media -p 7880:7880 -p 7881:7881 -p 7882:7882/udp livekit/livekit-server@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20 --dev --bind 0.0.0.0 --node-ip 127.0.0.1
      - run: npm test
        env:
          MEET8_TEST_DATABASE_URL: postgresql://meet8:meet8-ci-only@127.0.0.1:5432/meet8
          MEET8_TEST_LIVEKIT_URL: ws://127.0.0.1:7880
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          LIVEKIT_URL: ws://127.0.0.1:7880
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/
