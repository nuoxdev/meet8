name: meet8
services:
  database:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_DB: meet8
      POSTGRES_USER: meet8
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong PostgreSQL password in .env}
    volumes:
      - meet8-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U meet8 -d meet8']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://meet8:${POSTGRES_PASSWORD}@database:5432/meet8
    ports:
      - 127.0.0.1:4100:4100
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  meet8-data:
